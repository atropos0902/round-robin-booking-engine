include classpath("application.conf")
queues {
  calendar-sync-dlq {}
  email-dlq {}
  webhooks-dlq {}
  calendar-sync { defaultVisibilityTimeout = 5 seconds, deadLettersQueue { name = "calendar-sync-dlq", maxReceiveCount = 3 } }
  email { defaultVisibilityTimeout = 5 seconds, deadLettersQueue { name = "email-dlq", maxReceiveCount = 3 } }
  webhooks { defaultVisibilityTimeout = 5 seconds, deadLettersQueue { name = "webhooks-dlq", maxReceiveCount = 3 } }
}
