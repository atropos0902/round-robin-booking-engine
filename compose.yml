services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rr
    ports: ["127.0.0.1:55432:5432"]
  sqs:
    image: softwaremill/elasticmq-native:1.6.14
    ports: ["127.0.0.1:59324:9324"]
    volumes: ["./docs/local/elasticmq.conf:/opt/elasticmq.conf:ro"]
